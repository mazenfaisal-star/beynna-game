<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيننا</title><style>
body{margin:0;background:#191126;color:#fff8f2;font:16px system-ui;min-height:100vh}main{max-width:540px;margin:auto;padding:20px}.card{background:#2b203a;padding:20px;border-radius:20px;margin:14px 0}button,select,input,textarea{font:inherit;padding:12px;border-radius:12px;border:1px solid #ffffff30}button{background:#ff75a3;color:#271321;font-weight:bold;cursor:pointer}input,textarea,select{background:#191126;color:white;width:100%;box-sizing:border-box;margin:6px 0}.alt{background:#42334f;color:white}.row{display:flex;gap:8px}.row>*{flex:1}.hide{display:none!important}.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{background:#191126;color:white}.cat.on{outline:2px solid #ff75a3}.status{background:#422c4d;padding:12px;border-radius:12px;margin:10px 0}.q{font-size:22px;font-weight:bold;line-height:1.6}.score{display:flex;justify-content:space-around;color:#ffd67c}.share{text-align:center;font-size:24px;letter-spacing:5px;color:#ffd67c}
</style><main><header><b>💞 بيننا</b><button id="lang" class="alt" onclick="toggleLang()">🌐 EN</button></header><section id="home"><h1>قد إيه فاكرين حكايتكم؟</h1><div class="card"><input id="name" placeholder="اسمك"><div class="row"><button onclick="createRoom()">اعمل غرفة</button><button class="alt" onclick="document.getElementById('join').classList.remove('hide')">ادخل بكود</button></div><div id="join" class="hide"><input id="code" placeholder="كود الغرفة"><button onclick="joinRoom()">دخول</button></div><div id="lobby" class="hide"><p id="status">ابعت الكود للطرف التاني</p><div id="room" class="share"></div><div id="setup"><div id="cats" class="cats"></div><select id="count"><option>10</option><option>15</option><option>20</option></select><button onclick="startGame()">ابدأ اللعب</button></div></div><p id="error"></p></div></section><section id="game" class="hide card"><div class="score"><span id="sc0">0</span><span id="sc1">0</span></div><p id="round"></p><div id="question" class="q"></div><textarea id="answer" placeholder="اكتب إجابتك"></textarea><button onclick="sendAnswer()">إرسال</button><button class="alt" onclick="skip()">تخطي السؤال</button><button class="alt" onclick="penalty()">عقوبة عشوائية</button><div id="result" class="status"></div><button id="next" class="hide" onclick="next()">السؤال التالي</button></section></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const bank={"بدايتنا":["اتعرفنا فين؟","مين بدأ الكلام؟","إيه أول انطباع عني؟","فاكر أول رسالة؟","إيه أول خروجة؟","مين قال بحبك الأول؟","إيه أول هدية بينا؟","إمتى حسيت إننا بقينا قريبين؟","إيه أول حاجة ضحكتنا؟","إيه ذكرى من أول مقابلة؟"],"ذكرياتنا":["أكتر موقف ضحكنا فيه؟","أحلى يوم قضيناه سوا؟","أجمل مفاجأة؟","أغنية بتفكرك بيا؟","إيه موقف حسيت إني فاهمك؟","إيه أكلة بنحبها سوا؟","إيه ذكرى نفسك نكررها؟","مين بيتأخر أكتر؟","أحلى صورة لينا؟","إيه سر مضحك بينا؟"],"مشاعر وقرب":["إيه أكتر حاجة بتحبها في علاقتنا؟","إمتى بتحس إني قريب منك؟","إيه تصرف بسيط بيفرق معاك؟","إيه معنى الاهتمام عندك؟","إيه حاجة نتعلمها سوا؟","إيه حاجة نفسك أسمعها منك؟","إيه حدود مهمة بينا؟","إيه طريقة بتحب أعبّر بيها عن حبي؟","إيه وعد صغير نلتزم بيه؟","إيه أكتر حاجة مقدرها فيا؟"],"جرأة +18":["إيه نوع القرب الحميم اللي بتحبه؟","إيه خيال رومانسي تحب تشاركني بيه؟","إيه مبادرة جريئة ومريحة تحبها؟","إيه كلمة غزل جريئة بتحب تسمعها؟","إيه حدودك اللي لازم أحترمها؟","إيه حاجة جديدة تحب تجربها سوا؟","إيه أجواء بتحبها في موعد خاص؟","إيه تصرف بيخليك تحس إنك مرغوب؟","إيه نوع القبلات المفضل؟","إيه إشارة نستخدمها لو عايزين نوقف؟"]};let peer,conn,host=false,me='',partner='',code='',deck=[],i=0,answers=[null,null],lang='ar';const $=x=>document.getElementById(x);function toggleLang(){lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='ar'?'🌐 EN':'🌐 عربي';$('error').textContent=lang==='en'?'Most game content is currently in Arabic.':'محتوى اللعبة عربي حاليًا.'}function createRoom(){me=$('name').value||'اللاعب الأول';host=true;code=Math.random().toString(36).slice(2,8).toUpperCase();$('lobby').classList.remove('hide');$('room').textContent=code;$('setup').classList.remove('hide');$('cats').innerHTML=Object.keys(bank).map(c=>`<button class="cat on" data-c="${c}" onclick="this.classList.toggle('on')">${c}</button>`).join('');peer=new Peer('beynna-'+code);peer.on('connection',c=>{conn=c;wire();$('status').textContent='دخل شريكك!'});peer.on('error',()=>{$('error').textContent='تعذر الاتصال. أعد المحاولة.'})}function joinRoom(){me=$('name').value||'اللاعب الثاني';code=$('code').value.trim().toUpperCase();if(!code)return;$('lobby').classList.remove('hide');$('room').textContent=code;$('setup').classList.add('hide');peer=new Peer();peer.on('open',()=>{conn=peer.connect('beynna-'+code);conn.on('open',()=>{wire();conn.send({t:'join',name:me})})});peer.on('error',()=>{$('error').textContent='الكود غير صحيح أو الغرفة غير متاحة'})}function wire(){conn.on('data',m=>{if(m.t==='join'){partner=m.name;conn.send({t:'names',name:me});$('status').textContent='دخل شريكك!'}if(m.t==='names')partner=m.name;if(m.t==='start'){deck=m.deck;i=0;show()}if(m.t==='answer'){answers[m.p]=m.a;reveal()}if(m.t==='next'){i=m.i;answers=[null,null];show()}if(m.t==='penalty')$('result').textContent='🎯 العقوبة: '+m.v})}function startGame(){if(!conn||!conn.open)return;$('error').textContent='';let cats=[...document.querySelectorAll('.cat.on')].map(b=>b.dataset.c);deck=cats.flatMap(c=>bank[c].map(q=>({c,q}))).sort(()=>Math.random()-.5).slice(0,+$('count').value);conn.send({t:'start',deck});i=0;show()}function show(){$('home').classList.add('hide');$('game').classList.remove('hide');$('question').textContent=deck[i].q;$('round').textContent=`السؤال ${i+1} من ${deck.length} — ${deck[i].c}`;$('answer').value='';$('result').textContent='إجابتك تظهر بعد ما يجاوب الطرفان';$('next').classList.add('hide')}function sendAnswer(){if(!$('answer').value.trim())return;$('result').textContent='تم إرسال إجابتك، مستنيين الطرف التاني';conn.send({t:'answer',p:host?0:1,a:$('answer').value.trim()});answers[host?0:1]=$('answer').value.trim();reveal()}function skip(){answers[host?0:1]='تخطى السؤال';conn.send({t:'answer',p:host?0:1,a:'تخطى السؤال'});reveal()}function reveal(){if(answers[0]&&answers[1]){$('result').textContent=`إجابة 1: ${answers[0]} | إجابة 2: ${answers[1]}`;$('next').classList.remove('hide')}}const penalties=['قول مجاملة حلوة','غنّي مقطع أغنية','احكي ذكرى مضحكة','اختاروا موعدكم الجاي','قول 3 حاجات بتحبها'];function penalty(){let v=penalties[Math.random()*penalties.length|0];$('result').textContent='🎯 العقوبة: '+v;conn?.send({t:'penalty',v})}function next(){if(!host)return;i++;if(i>=deck.length){$('question').textContent='خلصت الجولة 💞';$('next').classList.add('hide');return}answers=[null,null];conn.send({t:'next',i});show()}
</script></html>
